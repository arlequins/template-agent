name: Production deployment

on:
  workflow_dispatch:
    inputs:
      include_batch:
        description: Deploy the optional batch application after API and web
        required: false
        default: false
        type: boolean

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy-api:
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      application: api
      environment: production
      stage: production
      operation: deploy
      role_arn: ${{ vars.AWS_PRODUCTION_ROLE_ARN }}

  deploy-web:
    needs: deploy-api
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      application: web
      environment: production
      stage: production
      operation: deploy
      role_arn: ${{ vars.AWS_PRODUCTION_ROLE_ARN }}

  deploy-batch:
    if: inputs.include_batch
    needs: deploy-web
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      application: batch
      environment: production
      stage: production
      operation: deploy
      role_arn: ${{ vars.AWS_PRODUCTION_ROLE_ARN }}
