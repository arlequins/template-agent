name: Preview deployment

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy-api:
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.AWS_PREVIEW_ROLE_ARN != ''
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      application: api
      environment: preview
      stage: pr-${{ github.event.pull_request.number }}
      operation: deploy
      role_arn: ${{ vars.AWS_PREVIEW_ROLE_ARN }}

  deploy-web:
    needs: deploy-api
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      application: web
      environment: preview
      stage: pr-${{ github.event.pull_request.number }}
      operation: deploy
      role_arn: ${{ vars.AWS_PREVIEW_ROLE_ARN }}

  remove:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.AWS_PREVIEW_ROLE_ARN != ''
    strategy:
      matrix:
        application: [web, api]
      max-parallel: 1
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      application: ${{ matrix.application }}
      environment: preview
      stage: pr-${{ github.event.pull_request.number }}
      operation: remove
      role_arn: ${{ vars.AWS_PREVIEW_ROLE_ARN }}
